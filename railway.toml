[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
# Run migrations at boot (non-blocking for old DBs). Prefer start over
# releaseCommand so a one-off migrate hiccup does not fail the whole deploy.
startCommand = "npm run migrate; npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
